name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What feature or improvement would you like to see?"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: "How would this feature help your workflow?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (optional)
      description: "Have you tried any workarounds or alternative approaches?"
